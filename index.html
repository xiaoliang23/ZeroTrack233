<!doctype html>
<html lang="en">
  <head>
    <script>
      // --- Bulletproof fetch override & error guard for sandboxed browser/iframe environments ---
      (function() {
        if (typeof window !== "undefined") {
          // 1. Intercept and ignore unhandled exceptions related to fetch getters/setters (common in browser extensions or sandboxes)
          window.addEventListener("error", function(event) {
            if (
              event.message &&
              (event.message.indexOf("Cannot set property fetch") !== -1 ||
                event.message.indexOf("has only a getter") !== -1 ||
                event.message.indexOf("property fetch of") !== -1)
            ) {
              event.preventDefault();
              console.warn("Gracefully handled and muted sandboxed/extension fetch override error:", event.message);
            }
          });

          // 2. Intercept and ignore promise rejections related to the fetch override
          window.addEventListener("unhandledrejection", function(event) {
            if (
              event.reason &&
              event.reason.message &&
              (event.reason.message.indexOf("Cannot set property fetch") !== -1 ||
                event.reason.message.indexOf("has only a getter") !== -1 ||
                event.reason.message.indexOf("property fetch of") !== -1)
            ) {
              event.preventDefault();
              console.warn("Gracefully handled and muted sandboxed/extension fetch override rejection:", event.reason.message);
            }
          });

          // 3. Try to redefine window.fetch with a custom getter/setter so assignments like `window.fetch = ...` succeed instead of throwing
          try {
            var originalFetch = window.fetch;
            if (originalFetch) {
              var currentFetch = originalFetch;
              Object.defineProperty(window, "fetch", {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e) {
            console.debug("Note: Environment window.fetch is fully locked and read-only. Fallback listener active.", e);
          }
        }
      })();
    </script>

</html>
