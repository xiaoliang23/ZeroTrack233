    <title>ZeroTrack 投资管理</title>
    <script>
      (function() {
        try {
          var origFetch = (typeof window !== 'undefined' && window.fetch) ? window.fetch : null;
          if (origFetch) {
            var activeFetch = origFetch;
            var descriptor = {
              get: function() { return activeFetch; },
              set: function(fn) { if (typeof fn === 'function') activeFetch = fn; },
              configurable: true,
              enumerable: true
            };
            try { Object.defineProperty(window, 'fetch', descriptor); } catch (e) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try { Object.defineProperty(Window.prototype, 'fetch', descriptor); } catch (e) {}
            }
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              try { Object.defineProperty(globalThis, 'fetch', descriptor); } catch (e) {}
            }
          }
        } catch (err) {}
      })();
    </script>
